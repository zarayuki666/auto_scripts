name: VPS8 Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '10 17 * * *'

# 关键权限：允许推送
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # =========================
      # 📥 主仓库
      # =========================
      - name: Checkout main repo
        uses: actions/checkout@v4

      # =========================
      # 🔐 私库脚本
      # =========================
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vps8-daily
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # ⏳ 随机延迟
      # =========================
      - name: Random delay
        run: |
          delay=$((RANDOM % 120))
          echo "⏳ 随机延迟: ${delay}s"
          sleep $delay

      # =========================
      # 🐍 Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 📦 系统依赖
      # =========================
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb curl wget unzip \
            fonts-liberation libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libxss1 libasound2t64

      # =========================
      # 🌐 安装 Chrome
      # =========================
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || true
          google-chrome --version || echo "Chrome check skipped"

      # =========================
      # 🐍 Python依赖
      # =========================
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pysocks

      # =========================
      # 🚀 安装 HY2
      # =========================
      - name: Install Hysteria2
        run: |
          curl -L -o hysteria https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x hysteria
          sudo mv hysteria /usr/local/bin/ || true
          hysteria version || echo "HY2 check skipped"

      # =========================
      # ▶️ 运行脚本
      # =========================
      - name: Run Script
        env:
          VPS8_BATCH: ${{ secrets.VPS8_BATCH }}
          VPS8_HY2_URL: ${{ secrets.VPS8_HY2_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p scripts/screenshots
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python3 scripts/main.py

      # =========================
      # 📸 上传截图（可选）
      # =========================
      - name: 📸 Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps8-screenshots-${{ github.run_id }}
          path: scripts/screenshots/
          retention-days: 7

      # =========================
      # ⏱️ 推送 time.is 日志（核心修改）
      # =========================
      - name: ⏱️ 提交执行时间 (time.is log)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p vps8
          {
            echo "Last Run: $(date +'%Y-%m-%d %H:%M:%S %Z')"
            echo "Workflow: VPS8 Daily"
            echo "Run ID: ${{ github.run_id }}"
            echo "Repository: ${{ github.repository }}"
          } > vps8/time.txt

          git add vps8/time.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "⚠️ 无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新 VPS8 执行时间 (time.is): $TIMESTAMP"
            git fetch origin main || true
            git push -f origin HEAD:main && echo "✅ time.is 日志已成功推送" || echo "⚠️ 推送失败（可能无权限或冲突）"
          fi
