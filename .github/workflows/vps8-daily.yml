name: VPS8 Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * *'

# 必须添加，否则无法推送
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # =========================
      # 📥 主仓库
      # =========================
      - name: 📥 检出主仓库
        uses: actions/checkout@v4

      # =========================
      # 🔐 私库脚本
      # =========================
      - name: 🔐 检出私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vps-8
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # ⏳ 随机延迟
      # =========================
      - name: ⏳ 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "⏳ 随机延迟: ${delay}s"
          sleep $delay

      # =========================
      # 🐍 Python
      # =========================
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 📦 系统依赖
      # =========================
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            curl \
            wget \
            unzip \
            fonts-liberation \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 \
            libasound2t64

      # =========================
      # 🌐 安装 Chrome
      # =========================
      - name: 🌐 安装 Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || true
          google-chrome --version || echo "Chrome 检查完成"

      # =========================
      # 🐍 Python 依赖
      # =========================
      - name: 🐍 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pysocks

      # =========================
      # 🚀 安装 Hysteria2
      # =========================
      - name: 🚀 安装 Hysteria2
        run: |
          curl -L -o hysteria https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x hysteria
          sudo mv hysteria /usr/local/bin/ || true
          hysteria version || echo "Hysteria2 检查完成"

      # =========================
      # ▶️ 运行脚本
      # =========================
      - name: ▶️ 运行脚本
        env:
          VPS8_BATCH: ${{ secrets.VPS8_BATCH }}
          VPS8_HY2_URL: ${{ secrets.VPS8_HY2_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p scripts/screenshots
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python3 scripts/main.py

      # =========================
      # ⏱️ 提交 time.is（核心新增）
      # =========================
      - name: ⏱️ 提交执行时间到 VPS8/time.is
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p VPS8
          echo "$(date +'%Y-%m-%d %H:%M:%S')" > VPS8/time.is
          
          git add VPS8/time.is 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "⚠️ 无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新 VPS8 Daily 执行时间: $TIMESTAMP"
            git fetch origin main
            git push -f origin HEAD:main
            echo "✅ 已推送到 main"
          fi

      # =========================
      # 📜 打印 time.is 日志
      # =========================
      - name: 📜 打印 time.is 日志
        if: always()
        run: |
          echo "========== VPS8/time.is =========="
          if [ -f VPS8/time.is ]; then
            cat VPS8/time.is
          else
            echo "文件不存在"
          fi
          echo "=================================="
